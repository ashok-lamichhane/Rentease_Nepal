# Render Blueprint for RentEase Nepal backend API
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: rentease-nepal-api
    runtime: node
    plan: free
    region: singapore
    branch: master
    rootDir: server
    buildCommand: npm install
    preDeployCommand: mkdir -p public/uploads
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URL
        sync: false
      - key: MONGO_DB_NAME
        value: rentease_nepal
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
